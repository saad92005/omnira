<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#12122a" />
      <stop offset="55%" stop-color="#08081a" />
      <stop offset="100%" stop-color="#05050a" />
    </radialGradient>

    <radialGradient id="orb" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#7ef3ff" />
      <stop offset="28%" stop-color="#22d3ee" />
      <stop offset="62%" stop-color="#8080f0" />
      <stop offset="100%" stop-color="#c026d3" />
    </radialGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8080f0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#8080f0" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ef3ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8080f0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="blur-lg"><feGaussianBlur stdDeviation="34" /></filter>
    <filter id="blur-sm"><feGaussianBlur stdDeviation="10" /></filter>
  </defs>

  <!-- Background: rounded square, dark space -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)" />

  <!-- Ambient glow behind the orb -->
  <circle cx="512" cy="500" r="340" fill="url(#glow)" filter="url(#blur-lg)" />

  <!-- Outer instrument ring, echoing the app's voice-orb motif -->
  <circle cx="512" cy="500" r="330" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.85" />
  <g opacity="0.55">
    <circle cx="512" cy="500" r="330" fill="none" stroke="#7ef3ff" stroke-width="3"
            stroke-dasharray="4 14" />
  </g>

  <!-- The core sphere -->
  <circle cx="512" cy="500" r="270" fill="url(#orb)" />

  <!-- Inset shading for a lit-sphere read (matches .omnira-orb__core in the app) -->
  <circle cx="512" cy="500" r="270" fill="none" stroke="#05050a" stroke-width="26" opacity="0.28" filter="url(#blur-sm)" />

  <!-- Glossy highlight -->
  <ellipse cx="420" cy="390" rx="140" ry="100" fill="url(#sheen)" />

  <!-- Small bright core, like the voice orb lit up -->
  <circle cx="512" cy="500" r="46" fill="#ffffff" opacity="0.92" filter="url(#blur-sm)" />
</svg>
